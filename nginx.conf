server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Root → default locale
    location = / {
        return 302 /en/;
    }

    location = /index.html {
        return 302 /en/;
    }

    # /en or /ar without trailing slash
    location ~ ^/(en|ar)$ {
        return 301 /$1/;
    }

    # /en/ or /ar/ → homepage
    location ~ ^/(en|ar)/?$ {
        try_files /index.html =404;
    }

    # /en/pages/... or /ar/anything → strip locale prefix, serve file
    location ~ ^/(en|ar)/(.+)$ {
        try_files /$2 /$2/ /index.html =404;
    }

    # Old links without locale prefix
    location ~ ^/pages/ {
        return 302 /en$request_uri;
    }

    # Backend API (Node.js on same container)
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets at site root
    location / {
        try_files $uri $uri/ =404;
    }
}
