server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Root → default locale
    location = / {
        return 302 /en/;
    }

    location = /index.html {
        return 302 /en/;
    }

    # /en or /ar without trailing slash
    location ~ ^/(en|ar)$ {
        return 301 /$1/;
    }

    # /en/ or /ar/ → homepage
    location ~ ^/(en|ar)/?$ {
        try_files /index.html =404;
    }

    # /en/pages/... or /ar/anything → strip locale prefix, serve file
    location ~ ^/(en|ar)/(.+)$ {
        try_files /$2 /$2/ /index.html =404;
    }

    # Old links without locale prefix
    location ~ ^/pages/ {
        return 302 /en$request_uri;
    }

    # Static assets at site root
    location / {
        try_files $uri $uri/ =404;
    }
}
