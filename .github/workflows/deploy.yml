name: Deploy My Website

# متى يعمل هذا السكريبت؟
on:
  push:
    branches: [ "main" ] # سيعمل فقط عندما ترفع كود لفرع main

jobs:
  deploy:
    # يخبر GitHub باستخدام السيرفر الخاص بك (الذي ربطناه سابقاً)
    runs-on: self-hosted 
    
    steps:
      # الخطوة 1: سحب الكود من GitHub إلى السيرفر
      - name: Checkout code
        uses: actions/checkout@v4

      # الخطوة 2: بناء وتشغيل الموقع باستخدام Docker
      - name: Build and Start Container
        run: |
          # بناء صورة للموقع
          docker build -t my-website-image .
          
          # حذف الحاوية القديمة إذا كانت موجودة (عشان ما يحصل تعارض)
          docker stop my-website-container || true
          docker rm my-website-container || true
          
          # تشغيل الموقع الجديد (مع متغيرات البيئة من GitHub Secrets)
          docker run -d --name my-website-container -p 80:80 \
            -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            -e SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            -e SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -e ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            -e NODE_ENV=production \
            -e PORT=3000 \
            my-website-image